name: Validation Gap
description: Report a missing validation coverage
title: "[Validation Gap]: "
labels: ["validation-gap"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What type of issue is this?
      options:
        - Validation Gap
        - Test Gap
        - Bug
        - Feature
        - Refactor / Tech Debt
        - Release Hardening
      default: 0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area does this issue affect?
      options:
        - UI/UX
        - Backend/API
        - Documentation
        - Core Algorithm
        - Build/Infrastructure
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What behavior is untested?
      description: Describe the functionality that currently lacks validation coverage.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Why it matters
      description: What is the risk of this behavior being unvalidated?
    validations:
      required: true
  - type: textarea
    id: suggested-approach
    attributes:
      label: Suggested test approach
      description: How should this gap be addressed? (e.g. unit test, integration test, E2E test)
    validations:
      required: true
