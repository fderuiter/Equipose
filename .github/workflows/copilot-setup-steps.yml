name: "Copilot Setup Steps"

# Re-run and validate the workspace configuration whenever this file changes
on:
  workflow_dispatch:
  push:
    paths:
    - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
    - .github/workflows/copilot-setup-steps.yml

jobs:
  # CRITICAL: This exact job key name is required by GitHub Copilot
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      with:
          # Automatically picks up the appropriate version or defaults to latest stable
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: "22"   # Aligns with modern environment typings specified in the repository
        cache: "pnpm"        # Leverages pnpm's global store cache topology for performance

    - name: Install Dependencies
        # Enforces strict lockfile compliance based on your pnpm-lock.yaml file
      run: pnpm install --frozen-lockfile
