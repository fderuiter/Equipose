name: Cleanup PR Preview

on:
  pull_request:
    types: [closed]
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          api.cloudflare.com:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      with:
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Delete Cloudflare Workers Preview
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "Cloudflare secrets are not available. Skipping cleanup."
          exit 0
        fi
        npx wrangler delete equipose-pr-${{ github.event.pull_request.number }}
    permissions:
      contents: read
